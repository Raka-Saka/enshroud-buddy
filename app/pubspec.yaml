name: ensh_companion
description: "Enshrouded companion: offline game data, save reader, planner."
publish_to: 'none'
version: 0.36.0+50

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  path_provider: 2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game.json
    - assets/map/
    - assets/shroud_levels.png
    - assets/cold.png
    - assets/height.png
    - assets/height.json
    - assets/skilltree/
    - assets/icons/
    - assets/map_icons/
    - assets/fonts/OFL.txt
    - assets/licenses/apache-2.0.txt
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
